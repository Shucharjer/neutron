name: Build

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: ${{ matrix.distro.name }} ${{ matrix.arch.name }} ${{ matrix.compiler.name }} C++${{ matrix.config.cxx_standard }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.arch.runner }}
    container: ${{ matrix.distro.container }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu
            container: ubuntu:26.04
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates git ninja-build cmake
            gxx_package: g++
            clang_package: clang
          - name: fedora
            container: fedora:latest
            install: dnf install -y ca-certificates git ninja-build cmake
            gxx_package: gcc-c++
            clang_package: clang
        arch:
          - name: x64
            runner: ubuntu-26.04
          - name: arm64
            runner: ubuntu-26.04-arm
        compiler:
          - name: g++
            cc: gcc
            cxx: g++
            package_key: gxx_package
          - name: clang++
            cc: clang
            cxx: clang++
            package_key: clang_package
        config:
          - name: stdexec
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: stdexec-no-aligned-allocation
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "OFF"
          - name: stdexec
            cxx_standard: 23
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 23
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"
          - name: stdexec
            cxx_standard: 26
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 26
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"

    steps:
      - name: Install dependencies
        run: |
          ${{ matrix.distro.install }}
          if [ "${{ matrix.compiler.package_key }}" = "gxx_package" ]; then
            if [ "${{ matrix.distro.name }}" = "ubuntu" ]; then
              apt-get install -y --no-install-recommends ${{ matrix.distro.gxx_package }}
            else
              dnf install -y ${{ matrix.distro.gxx_package }}
            fi
          else
            if [ "${{ matrix.distro.name }}" = "ubuntu" ]; then
              apt-get install -y --no-install-recommends ${{ matrix.distro.clang_package }}
            else
              dnf install -y ${{ matrix.distro.clang_package }}
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cxx_standard }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DNEUTRON_INSTALL=OFF \
            -DBUILD_NEUTRON_TESTING=ON \
            -DNEUTRON_ALIGNED_ALLOCATION=${{ matrix.config.aligned_allocation }} \
            -DNEUTRON_USES_STDEXEC=${{ matrix.config.stdexec }} \
            -DNEUTRON_USES_BEMAN_EXECUTION=${{ matrix.config.beman }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2 --output-junit test-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ strategy.job-index }}
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  linux-mingw:
    name: ${{ matrix.distro.name }} ${{ matrix.arch.name }} MinGW ${{ matrix.target }} C++${{ matrix.config.cxx_standard }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.arch.runner }}
    container: ${{ matrix.distro.container }}
    # Ubuntu ships MinGW GCC 13, which lacks deducing this (needed by beman)
    # and is not recognized by CMake as supporting C++26.
    continue-on-error: ${{ matrix.distro.name == 'ubuntu' && (matrix.config.beman == 'ON' || matrix.config.cxx_standard == 26) }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu
            container: ubuntu:26.04
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates git ninja-build cmake g++-mingw-w64-x86-64
          - name: fedora
            container: fedora:latest
            install: dnf install -y ca-certificates git ninja-build cmake mingw64-gcc-c++
        arch:
          - name: x64
            runner: ubuntu-26.04
          - name: arm64
            runner: ubuntu-26.04-arm
        target:
          - x86_64-w64-mingw32
        config:
          - name: stdexec
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
          - name: stdexec
            cxx_standard: 23
            stdexec: "ON"
            beman: "OFF"
          - name: beman
            cxx_standard: 23
            stdexec: "OFF"
            beman: "ON"
          - name: stdexec
            cxx_standard: 26
            stdexec: "ON"
            beman: "OFF"
          - name: beman
            cxx_standard: 26
            stdexec: "OFF"
            beman: "ON"
        aligned_allocation: ["ON", "OFF"]

    steps:
      - name: Install dependencies
        run: ${{ matrix.distro.install }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=${{ matrix.target }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.target }}-g++ \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cxx_standard }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DNEUTRON_INSTALL=OFF \
            -DBUILD_NEUTRON_TESTING=ON \
            -DNEUTRON_ALIGNED_ALLOCATION=${{ matrix.aligned_allocation }} \
            -DNEUTRON_USES_STDEXEC=${{ matrix.config.stdexec }} \
            -DNEUTRON_USES_BEMAN_EXECUTION=${{ matrix.config.beman }}

      - name: Build
        run: cmake --build build --parallel

  windows:
    name: windows ${{ matrix.compiler.name }} C++${{ matrix.config.cxx_standard }} ${{ matrix.config.name }}
    runs-on: windows-2025-vs2026
    # MSVC does not support C++26 yet.
    continue-on-error: ${{ matrix.compiler.name == 'msvc' && matrix.config.cxx_standard == 26 }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: msvc
            generator: "Visual Studio 18 2026"
            architecture: x64
          - name: mingw
            generator: Ninja
            architecture: ""
        config:
          - name: stdexec
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: stdexec-no-aligned-allocation
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "OFF"
          - name: stdexec
            cxx_standard: 23
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 23
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"
          - name: stdexec
            cxx_standard: 26
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 26
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MinGW
        if: matrix.compiler.name == 'mingw'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # Latest release of https://github.com/niXman/mingw-builds-binaries
          gh release download --repo niXman/mingw-builds-binaries `
            --pattern "x86_64-*-release-posix-seh-ucrt-*.7z" --output mingw.7z
          7z x mingw.7z -omingw
          $bin = Get-ChildItem mingw -Recurse -Directory -Filter bin |
            Where-Object { Test-Path (Join-Path $_.FullName "g++.exe") } |
            Select-Object -First 1
          if ($null -eq $bin) {
            throw "No MinGW bin directory found"
          }
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin.FullName "g++.exe") --version

      - name: Configure MSVC
        if: matrix.compiler.name == 'msvc'
        run: |
          cmake -S . -B build `
            -G "${{ matrix.compiler.generator }}" `
            -A ${{ matrix.compiler.architecture }} `
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cxx_standard }} `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DNEUTRON_INSTALL=OFF `
            -DBUILD_NEUTRON_TESTING=ON `
            -DNEUTRON_ALIGNED_ALLOCATION=${{ matrix.config.aligned_allocation }} `
            -DNEUTRON_USES_STDEXEC=${{ matrix.config.stdexec }} `
            -DNEUTRON_USES_BEMAN_EXECUTION=${{ matrix.config.beman }}

      - name: Configure MinGW
        if: matrix.compiler.name == 'mingw'
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cxx_standard }} `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DNEUTRON_INSTALL=OFF `
            -DBUILD_NEUTRON_TESTING=ON `
            -DNEUTRON_ALIGNED_ALLOCATION=${{ matrix.config.aligned_allocation }} `
            -DNEUTRON_USES_STDEXEC=${{ matrix.config.stdexec }} `
            -DNEUTRON_USES_BEMAN_EXECUTION=${{ matrix.config.beman }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2 --output-junit test-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ strategy.job-index }}
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: ${{ matrix.runner }} clang++ C++${{ matrix.config.cxx_standard }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 is the macOS 27 image (preview)
        runner: [xcode-27, macos-26]
        config:
          - name: stdexec
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: stdexec-no-aligned-allocation
            cxx_standard: 20
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "OFF"
          - name: stdexec
            cxx_standard: 23
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 23
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"
          - name: stdexec
            cxx_standard: 26
            stdexec: "ON"
            beman: "OFF"
            aligned_allocation: "ON"
          - name: beman
            cxx_standard: 26
            stdexec: "OFF"
            beman: "ON"
            aligned_allocation: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cxx_standard }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DNEUTRON_INSTALL=OFF \
            -DBUILD_NEUTRON_TESTING=ON \
            -DNEUTRON_ALIGNED_ALLOCATION=${{ matrix.config.aligned_allocation }} \
            -DNEUTRON_USES_STDEXEC=${{ matrix.config.stdexec }} \
            -DNEUTRON_USES_BEMAN_EXECUTION=${{ matrix.config.beman }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2 --output-junit test-results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ strategy.job-index }}
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
